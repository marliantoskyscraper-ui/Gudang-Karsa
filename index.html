<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi Absensi Digital Berbasis Lokasi dan Foto">
    <title>Aplikasi Absensi Digital (Cloud Version)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Map Firebase Imports -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
      }
    </script>
</head>
<body class="bg-slate-100 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, setDoc, deleteDoc, getDocs } from 'firebase/firestore';

        const { useState, useEffect, useRef } = React;

        // --- INISIALISASI CLOUD DATABASE ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-absensi-app';

        // --- DATA DUMMY AKUN ---
        const initialUsers = [
          { id: 1, username: 'budi', password: '123', name: 'Budi Santoso', role: 'employee', department: 'IT' },
          { id: 2, username: 'siti', password: '123', name: 'Siti Aminah', role: 'employee', department: 'Marketing' },
          { id: 99, username: 'admin', password: 'admin', name: 'Admin Pusat', role: 'admin' }
        ];

        // --- FUNGSI HELPER ---
        function getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
          const R = 6371000; 
          const dLat = deg2rad(lat2 - lat1);
          const dLon = deg2rad(lon2 - lon1);
          const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          return Math.round(R * c); 
        }
        function deg2rad(deg) { return deg * (Math.PI / 180); }

        // Fungsi Export CSV
        function exportToCSV(data, filename) {
            if (data.length === 0) return;
            // Filter out base64 photos and internal IDs from export
            const cleanData = data.map(({ dbId, photo, ...rest }) => rest);
            const headers = Object.keys(cleanData[0]).join(',');
            const rows = cleanData.map(obj => Object.values(obj).map(val => `"${val}"`).join(',')).join('\n');
            const csv = headers + '\n' + rows;
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
        }

        // --- KOMPONEN UTAMA ---
        function AbsensiApp() {
          const [currentUser, setCurrentUser] = useState(null); 
          const [firebaseUser, setFirebaseUser] = useState(null);
          const [dbStatus, setDbStatus] = useState('Menghubungkan ke Cloud...');
          const [toastMsg, setToastMsg] = useState('');

          // Data State (Cloud Sync)
          const [logs, setLogs] = useState([]);
          const [requests, setRequests] = useState([]);
          const [reports, setReports] = useState([]);
          const [officeLoc, setOfficeLoc] = useState({ lat: -6.200000, lng: 106.816666 });
          const MAX_DISTANCE_METERS = 100;

          // Autentikasi Cloud Setup
          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (error) {
                console.error("Auth error:", error);
                setDbStatus('Gagal terhubung ke Cloud');
              }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (user) => {
               setFirebaseUser(user);
               if(user) setDbStatus('Cloud Database Terhubung');
            });
            return () => unsubscribe();
          }, []);

          // Sinkronisasi Data Real-time (Hanya berjalan jika sudah auth)
          useEffect(() => {
            if (!firebaseUser) return;

            // Paths
            const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'logs');
            const reqRef = collection(db, 'artifacts', appId, 'public', 'data', 'requests');
            const repRef = collection(db, 'artifacts', appId, 'public', 'data', 'reports');
            const setRef = collection(db, 'artifacts', appId, 'public', 'data', 'settings');

            const unsubLogs = onSnapshot(logsRef, (snap) => {
              const data = snap.docs.map(doc => ({ dbId: doc.id, ...doc.data() }));
              setLogs(data.sort((a,b) => b.timestamp - a.timestamp)); // Urutkan terbaru
            }, (err) => console.error(err));

            const unsubReqs = onSnapshot(reqRef, (snap) => {
              const data = snap.docs.map(doc => ({ dbId: doc.id, ...doc.data() }));
              setRequests(data.sort((a,b) => b.timestamp - a.timestamp));
            }, (err) => console.error(err));

            const unsubReps = onSnapshot(repRef, (snap) => {
              const data = snap.docs.map(doc => ({ dbId: doc.id, ...doc.data() }));
              setReports(data.sort((a,b) => b.timestamp - a.timestamp));
            }, (err) => console.error(err));

            const unsubSet = onSnapshot(setRef, (snap) => {
              const locDoc = snap.docs.find(d => d.id === 'office_location');
              if (locDoc) setOfficeLoc(locDoc.data());
            }, (err) => console.error(err));

            return () => { unsubLogs(); unsubReqs(); unsubReps(); unsubSet(); };
          }, [firebaseUser]);

          // Fungsi Tulis ke Database
          const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 3000); };

          const handleAddLog = async (log) => {
             await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'logs'), { ...log, timestamp: Date.now() });
             showToast("Absen berhasil disimpan ke Cloud!");
          };
          const handleAddRequest = async (req) => {
             await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'requests'), { ...req, timestamp: Date.now() });
             showToast("Pengajuan berhasil dikirim ke Admin!");
          };
          const handleAddReport = async (rep) => {
             await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), { ...rep, timestamp: Date.now() });
             showToast("Laporan disimpan ke Cloud!");
          };
          const handleUpdateReqStatus = async (dbId, status) => {
             await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'requests', dbId), { status });
             showToast("Status pengajuan diperbarui.");
          };
          const handleUpdateLoc = async (newLoc) => {
             await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'office_location'), newLoc);
             showToast("Lokasi Kantor Pusat berhasil diperbarui.");
          };
          const handleClearAllLogs = async () => {
             // Simulasi hapus semua log (di production sebaiknya di-batch)
             showToast("Mulai menghapus data log...");
             const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'logs'));
             snapshot.forEach(async (document) => {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'logs', document.id));
             });
             showToast("Data log absensi dibersihkan!");
          };

          // --- UI LOGIN ---
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');
          const [loginError, setLoginError] = useState('');

          const handleLogin = (e) => {
            e.preventDefault();
            const user = initialUsers.find(u => u.username === username && u.password === password);
            if (user) {
              setCurrentUser(user);
              setLoginError('');
              setUsername(''); setPassword('');
            } else {
              setLoginError('Username atau password salah!');
            }
          };

          if (!currentUser) {
            return (
              <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden mb-4">
                  <div className="bg-blue-600 p-6 text-center relative overflow-hidden">
                    <div className="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
                    <i className="fas fa-cloud text-5xl text-white mx-auto mb-3 block drop-shadow-md"></i>
                    <h1 className="text-2xl font-bold text-white leading-tight">Absensi Cloud</h1>
                    <p className="text-blue-100 mt-1 text-sm font-medium tracking-wide">Tersinkronisasi Real-time</p>
                  </div>
                  <div className="p-6 space-y-4">
                    <h2 className="text-gray-700 font-semibold text-center mb-4">Silakan Login</h2>
                    
                    {loginError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center border border-red-200 animate-pulse">{loginError}</div>}

                    <form onSubmit={handleLogin} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} className="w-full border-gray-300 rounded-xl shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50 p-3 outline-none border transition-all" placeholder="Masukkan username..." />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full border-gray-300 rounded-xl shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-gray-50 p-3 outline-none border transition-all" placeholder="Masukkan password..." />
                      </div>
                      <button type="submit" className="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl flex items-center justify-center transition-colors mt-2 shadow-md hover:shadow-lg">
                        MASUK APLIKASI
                      </button>
                    </form>

                    <div className="mt-6 pt-4 border-t border-gray-100 text-sm text-gray-500">
                      <p className="font-semibold mb-2">Pilih Akun Demo:</p>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div onClick={()=>{setUsername('budi');setPassword('123');}} className="bg-gray-50 p-2 rounded-lg border border-gray-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition-colors">
                          <span className="block font-bold text-gray-700 mb-1">Pegawai</span>
                          user: <span className="font-mono text-blue-600">budi</span><br/>pass: <span className="font-mono text-blue-600">123</span>
                        </div>
                        <div onClick={()=>{setUsername('admin');setPassword('admin');}} className="bg-gray-50 p-2 rounded-lg border border-gray-200 cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition-colors">
                          <span className="block font-bold text-gray-700 mb-1">Admin</span>
                          user: <span className="font-mono text-blue-600">admin</span><br/>pass: <span className="font-mono text-blue-600">admin</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div className={`text-xs px-4 py-2 rounded-full flex items-center font-medium ${dbStatus.includes('Terhubung') ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>
                   <i className={`fas ${dbStatus.includes('Terhubung') ? 'fa-check-circle' : 'fa-spinner fa-spin'} mr-2`}></i> {dbStatus}
                </div>
              </div>
            );
          }

          // Global Toast Notification
          const ToastUI = () => toastMsg ? (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center text-sm font-medium animate-bounce">
              <i className="fas fa-info-circle mr-2 text-blue-400"></i> {toastMsg}
            </div>
          ) : null;

          return (
            <div className="min-h-screen bg-slate-100">
              <ToastUI />
              {currentUser.role === 'employee' ? (
                <EmployeeDashboard 
                  user={currentUser} 
                  onLogout={() => setCurrentUser(null)} 
                  officeLoc={officeLoc}
                  maxDist={MAX_DISTANCE_METERS}
                  addLog={handleAddLog}
                  addRequest={handleAddRequest}
                  addReport={handleAddReport}
                  showToast={showToast}
                />
              ) : (
                <AdminDashboard 
                  user={currentUser} 
                  onLogout={() => setCurrentUser(null)}
                  logs={logs}
                  requests={requests}
                  reports={reports}
                  officeLoc={officeLoc}
                  setOfficeLoc={handleUpdateLoc}
                  clearLogs={handleClearAllLogs}
                  updateRequestStatus={handleUpdateReqStatus}
                  exportData={() => {
                     exportToCSV(logs, `Data_Absensi_${new Date().toLocaleDateString('id-ID')}.csv`);
                     showToast("File Excel (CSV) Absensi Berhasil Diunduh!");
                  }}
                />
              )}
            </div>
          );
        }

        // --- DASHBOARD PEGAWAI ---
        function EmployeeDashboard({ user, onLogout, officeLoc, maxDist, addLog, addRequest, addReport, showToast }) {
          const [activeTab, setActiveTab] = useState('absen');

          return (
            <div className="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col relative">
              <div className="bg-blue-600 text-white p-5 rounded-b-3xl shadow-lg z-10 relative overflow-hidden">
                <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full blur-2xl -mr-10 -mt-10"></div>
                <div className="flex justify-between items-center mb-4 relative z-10">
                  <div>
                    <h2 className="text-xl font-bold">{user.name}</h2>
                    <p className="text-blue-200 text-sm">{user.department}</p>
                  </div>
                  <button onClick={onLogout} className="w-10 h-10 bg-blue-700/50 rounded-full flex items-center justify-center hover:bg-blue-800 transition-colors">
                    <i className="fas fa-sign-out-alt"></i>
                  </button>
                </div>
                <div className="bg-white/10 rounded-xl p-3 flex items-center relative z-10 border border-white/20 shadow-inner">
                  <i className="fas fa-clock text-xl mr-2 text-blue-100"></i>
                  <span className="font-medium text-lg tracking-wider">{new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span>
                  <span className="ml-auto text-xs bg-white text-blue-700 font-bold px-3 py-1.5 rounded-lg shadow-sm">{new Date().toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' })}</span>
                </div>
              </div>

              <div className="flex-1 p-5 overflow-y-auto pb-24 bg-slate-50">
                {activeTab === 'absen' && <TabAbsen user={user} officeLoc={officeLoc} maxDist={maxDist} addLog={addLog} showToast={showToast} />}
                {activeTab === 'pengajuan' && <TabPengajuan addRequest={addRequest} user={user} />}
                {activeTab === 'laporan' && <TabLaporan addReport={addReport} user={user} />}
              </div>

              <div className="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-2 pb-5 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-20">
                <NavButton icon="fas fa-camera" label="Absen" isActive={activeTab === 'absen'} onClick={() => setActiveTab('absen')} />
                <NavButton icon="fas fa-file-alt" label="Pengajuan" isActive={activeTab === 'pengajuan'} onClick={() => setActiveTab('pengajuan')} />
                <NavButton icon="fas fa-chart-line" label="Laporan" isActive={activeTab === 'laporan'} onClick={() => setActiveTab('laporan')} />
              </div>
            </div>
          );
        }

        function NavButton({ icon, label, isActive, onClick }) {
          return (
            <button onClick={onClick} className={`flex flex-col items-center p-2 rounded-xl w-20 transition-all duration-300 ${isActive ? '-translate-y-2' : 'hover:-translate-y-1'}`}>
              <div className={`w-12 h-12 rounded-2xl flex items-center justify-center mb-1 transition-all duration-300 ${isActive ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : 'bg-transparent text-gray-400'}`}>
                <i className={`${icon} text-xl`}></i>
              </div>
              <span className={`text-[10px] font-bold ${isActive ? 'text-blue-600' : 'text-gray-400'}`}>{label}</span>
            </button>
          );
        }

        // --- TAB ABSENSI (Kamera & GPS) ---
        function TabAbsen({ user, officeLoc, maxDist, addLog, showToast }) {
          const [location, setLocation] = useState(null);
          const [distance, setDistance] = useState(null);
          const [locError, setLocError] = useState("Sedang mencari lokasi...");
          
          const [isCameraOpen, setIsCameraOpen] = useState(false);
          const [absenType, setAbsenType] = useState(''); 
          const videoRef = useRef(null);
          const [photoData, setPhotoData] = useState(null);

          const fetchLocation = () => {
            setLocError("Mencari lokasi akurat...");
            setLocation(null); setDistance(null);

            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  const userLat = pos.coords.latitude;
                  const userLng = pos.coords.longitude;
                  setLocation({ lat: userLat, lng: userLng });
                  const dist = getDistanceFromLatLonInM(userLat, userLng, officeLoc.lat, officeLoc.lng);
                  setDistance(dist);
                  setLocError(null);
                },
                (err) => {
                  if (err.code === 1) setLocError("Izin lokasi ditolak browser.");
                  else if (err.code === 2) setLocError("Sinyal GPS tidak tersedia.");
                  else if (err.code === 3) setLocError("Waktu permintaan lokasi habis.");
                  else setLocError("Gagal akses GPS.");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
              );
            } else {
              setLocError("Peramban tidak dukung GPS.");
            }
          };

          useEffect(() => { fetchLocation(); }, [officeLoc]);

          useEffect(() => {
            let stream;
            if (isCameraOpen && !photoData) {
              navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(s => { stream = s; if (videoRef.current) videoRef.current.srcObject = s; })
                .catch(err => { showToast("Gagal akses kamera browser!"); setIsCameraOpen(false); });
            }
            return () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
          }, [isCameraOpen, photoData]);

          const handleOpenAbsen = (type) => {
            if (!location) return showToast("Tunggu GPS ditemukan!");
            if (distance > maxDist) {
               showToast(`Luar Jangkauan! Jarak Anda ${distance}m (Batas ${maxDist}m). Log ditandai MERAH.`);
            }
            setAbsenType(type); setIsCameraOpen(true); setPhotoData(null);
          };

          const takePhotoAndSubmit = () => {
            if (videoRef.current) {
              const canvas = document.createElement('canvas');
              canvas.width = videoRef.current.videoWidth; canvas.height = videoRef.current.videoHeight;
              canvas.getContext('2d').drawImage(videoRef.current, 0, 0);
              const photoBase64 = canvas.toDataURL('image/jpeg', 0.5); 
              setPhotoData(photoBase64);
              
              addLog({
                userName: user.name, type: absenType,
                time: new Date().toLocaleTimeString('id-ID'), date: new Date().toLocaleDateString('id-ID'),
                photo: photoBase64, status: distance <= maxDist ? 'Tepat Lokasi' : 'Luar Jangkauan'
              });

              setTimeout(() => { setIsCameraOpen(false); }, 1000);
            }
          };

          if (isCameraOpen) {
            return (
              <div className="fixed inset-0 bg-slate-900 z-50 flex flex-col">
                <div className="p-4 flex justify-between items-center text-white bg-slate-900 absolute top-0 w-full z-10 shadow-md">
                  <span className="font-bold tracking-wide">Absen: {absenType}</span>
                  <button onClick={() => setIsCameraOpen(false)} className="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center"><i className="fas fa-times"></i></button>
                </div>
                <div className="flex-1 relative flex items-center justify-center overflow-hidden mt-14">
                  {!photoData && <video ref={videoRef} autoPlay playsInline className="min-w-full min-h-full object-cover" />}
                  {photoData && <img src={photoData} alt="Hasil" className="min-w-full min-h-full object-cover" />}
                  {!photoData && <div className="absolute inset-0 border-[40px] border-slate-900/60 rounded-full w-[300px] h-[400px] m-auto pointer-events-none"></div>}
                </div>
                <div className="h-32 bg-slate-900 flex items-center justify-center pb-8 pt-4">
                  {!photoData ? (
                     <button onClick={takePhotoAndSubmit} className="w-20 h-20 bg-white rounded-full border-4 border-slate-400 flex items-center justify-center hover:bg-gray-200 active:scale-95 transition-transform shadow-[0_0_15px_rgba(255,255,255,0.3)]">
                       <div className="w-16 h-16 border-2 border-slate-800 rounded-full"></div>
                     </button>
                  ) : <div className="flex flex-col items-center"><i className="fas fa-cloud-upload-alt text-3xl text-green-400 animate-bounce mb-2"></i><p className="text-green-400 font-bold text-sm">Menyimpan ke Cloud...</p></div>}
                </div>
              </div>
            );
          }

          return (
            <div className="space-y-5">
              <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm relative overflow-hidden">
                <div className="absolute top-0 right-0 w-16 h-16 bg-blue-50 rounded-bl-full -z-0"></div>
                <div className="flex items-start justify-between relative z-10">
                  <div className="flex items-start">
                    <div className={`w-12 h-12 rounded-xl mr-4 flex items-center justify-center text-xl shadow-sm ${distance !== null && distance <= maxDist ? 'bg-gradient-to-br from-green-100 to-green-200 text-green-600' : 'bg-gradient-to-br from-red-100 to-red-200 text-red-600'}`}>
                      <i className="fas fa-map-marker-alt"></i>
                    </div>
                    <div>
                      <h3 className="font-bold text-gray-800 mb-1">Status GPS</h3>
                      {locError ? (
                        <p className="text-xs text-red-500 font-medium bg-red-50 p-1.5 rounded-md inline-block">{locError}</p>
                      ) : (
                        <div>
                          <p className="text-xs text-gray-500 mb-0.5">Jarak ke kantor: <strong className={distance <= maxDist ? 'text-green-600' : 'text-red-600'}>{distance} m</strong></p>
                          <p className="text-[10px] font-bold uppercase tracking-wider">
                            {distance <= maxDist ? <span className="text-green-600"><i className="fas fa-check-circle mr-1"></i> Valid Radius</span> : <span className="text-red-500"><i className="fas fa-times-circle mr-1"></i> Luar Jangkauan</span>}
                          </p>
                        </div>
                      )}
                    </div>
                  </div>
                  <button onClick={fetchLocation} className="w-10 h-10 bg-slate-50 text-blue-500 hover:bg-blue-100 rounded-full transition-colors flex items-center justify-center shadow-sm" title="Perbarui Lokasi">
                    <i className="fas fa-sync-alt"></i>
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <ActionBtn icon="fas fa-sign-in-alt" label="Masuk" color="green" onClick={() => handleOpenAbsen('Masuk Kerja')} />
                <ActionBtn icon="fas fa-coffee" label="Istirahat" color="yellow" onClick={() => handleOpenAbsen('Mulai Istirahat')} />
                <ActionBtn icon="fas fa-briefcase" label="Kembali" color="blue" onClick={() => handleOpenAbsen('Selesai Istirahat')} />
                <ActionBtn icon="fas fa-sign-out-alt" label="Pulang" color="red" onClick={() => handleOpenAbsen('Pulang Kerja')} />
              </div>
            </div>
          );
        }

        function ActionBtn({ icon, label, color, onClick }) {
          const colorClasses = {
            green: 'bg-emerald-500 hover:bg-emerald-600 shadow-emerald-200',
            yellow: 'bg-amber-500 hover:bg-amber-600 shadow-amber-200',
            blue: 'bg-blue-500 hover:bg-blue-600 shadow-blue-200',
            red: 'bg-rose-500 hover:bg-rose-600 shadow-rose-200'
          };
          return (
            <button onClick={onClick} className={`${colorClasses[color]} text-white p-4 rounded-2xl flex flex-col items-center justify-center shadow-lg transition-transform active:scale-95 group`}>
              <i className={`${icon} text-2xl mb-2 group-hover:scale-110 transition-transform`}></i>
              <span className="font-bold text-sm tracking-wide">{label}</span>
            </button>
          );
        }

        // --- TAB PENGAJUAN ---
        function TabPengajuan({ addRequest, user }) {
          const [type, setType] = useState('Cuti');
          const [reason, setReason] = useState('');
          const [date, setDate] = useState('');

          const handleSubmit = (e) => {
            e.preventDefault();
            addRequest({ userName: user.name, type, reason, date, status: 'Menunggu' });
            setReason(''); setDate('');
          };

          return (
            <div className="space-y-4">
              <h2 className="font-bold text-gray-800 text-lg mb-2">Form Pengajuan <i className="fas fa-cloud text-blue-400 text-sm ml-1" title="Terkoneksi ke Admin"></i></h2>
              <form onSubmit={handleSubmit} className="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Jenis Izin</label>
                  <select value={type} onChange={(e) => setType(e.target.value)} className="w-full border-gray-200 rounded-xl shadow-sm focus:border-blue-500 focus:ring-blue-500 bg-slate-50 p-3 outline-none border font-medium text-gray-700">
                    <option>Cuti</option> <option>Izin</option> <option>Sakit</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Tanggal</label>
                  <input type="date" required value={date} onChange={(e) => setDate(e.target.value)} className="w-full border-gray-200 rounded-xl shadow-sm bg-slate-50 p-3 outline-none border font-medium text-gray-700" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Keterangan</label>
                  <textarea required value={reason} onChange={(e) => setReason(e.target.value)} rows="3" className="w-full border-gray-200 rounded-xl shadow-sm bg-slate-50 p-3 outline-none border font-medium text-gray-700 text-sm"></textarea>
                </div>
                <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md">KIRIM KE ADMIN</button>
              </form>
            </div>
          );
        }

        // --- TAB LAPORAN ---
        function TabLaporan({ addReport, user }) {
          const [content, setContent] = useState('');
          const handleSubmit = (e) => {
            e.preventDefault();
            addReport({ userName: user.name, date: new Date().toLocaleDateString('id-ID'), time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }), content });
            setContent('');
          };
          return (
            <div className="space-y-4">
              <h2 className="font-bold text-gray-800 text-lg mb-2">Laporan Harian</h2>
              <form onSubmit={handleSubmit} className="bg-white p-5 rounded-2xl shadow-sm space-y-4">
                <div>
                  <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Aktivitas Hari Ini</label>
                  <textarea required value={content} onChange={(e) => setContent(e.target.value)} rows="8" className="w-full border-gray-200 rounded-xl shadow-sm bg-slate-50 p-3 outline-none border font-medium text-gray-700 text-sm" placeholder="Tulis rincian pekerjaan di sini..."></textarea>
                </div>
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md flex items-center justify-center">
                   <i className="fas fa-paper-plane mr-2"></i> SIMPAN LAPORAN
                </button>
              </form>
            </div>
          );
        }

        // --- DASHBOARD ADMIN ---
        function AdminDashboard({ user, onLogout, logs, requests, reports, officeLoc, setOfficeLoc, clearLogs, updateRequestStatus, exportData }) {
          const [activeTab, setActiveTab] = useState('monitoring');
          const [showLocModal, setShowLocModal] = useState(false);
          const [newLat, setNewLat] = useState(officeLoc.lat);
          const [newLng, setNewLng] = useState(officeLoc.lng);

          const menuItems = [
            { id: 'monitoring', label: 'Monitoring Absensi', icon: 'fas fa-desktop' },
            { id: 'validasi', label: 'Persetujuan Izin', icon: 'fas fa-clipboard-check' },
            { id: 'laporan', label: 'Aktivitas Karyawan', icon: 'fas fa-tasks' }
          ];

          return (
            <div className="flex h-screen bg-slate-100 font-sans">
              {/* Sidebar Desktop */}
              <div className="w-64 bg-slate-900 text-white hidden md:flex flex-col shadow-2xl z-20">
                <div className="p-6 bg-slate-950 border-b border-slate-800 flex items-center">
                  <div className="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center mr-3 shadow-lg shadow-blue-500/30">
                     <i className="fas fa-cloud text-xl"></i>
                  </div>
                  <div><h1 className="font-bold text-lg leading-tight tracking-wide">Admin Hub</h1><p className="text-[10px] text-blue-300 font-bold uppercase tracking-widest mt-0.5">Cloud Database</p></div>
                </div>
                <div className="flex-1 py-6 px-3 space-y-1">
                  {menuItems.map(item => (
                    <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center px-4 py-3.5 rounded-xl text-sm font-semibold transition-all ${activeTab === item.id ? 'bg-blue-600 text-white shadow-md shadow-blue-600/20' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                      <i className={`${item.icon} text-lg mr-3 w-6 text-center`}></i>{item.label}
                    </button>
                  ))}
                  
                  <div className="pt-6 pb-2 px-4">
                     <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Pengaturan</p>
                     <button onClick={() => setShowLocModal(true)} className="w-full flex items-center px-4 py-2.5 rounded-lg text-sm font-semibold text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition-all">
                       <i className="fas fa-map-marker-alt text-lg mr-3 w-6 text-center"></i>Lokasi Kantor
                     </button>
                     <button onClick={clearLogs} className="w-full flex items-center px-4 py-2.5 rounded-lg text-sm font-semibold text-rose-400 hover:bg-rose-500/10 transition-all mt-1">
                       <i className="fas fa-trash-alt text-lg mr-3 w-6 text-center"></i>Reset Absensi
                     </button>
                  </div>
                </div>
                <div className="p-4 border-t border-slate-800">
                  <button onClick={onLogout} className="w-full flex items-center justify-center py-3 px-4 bg-slate-800 text-slate-300 font-bold rounded-xl hover:bg-slate-700 transition-colors"><i className="fas fa-power-off mr-2"></i> KELUAR</button>
                </div>
              </div>

              {/* Konten Utama */}
              <div className="flex-1 flex flex-col overflow-hidden bg-slate-50/50">
                {/* Header Mobile */}
                <div className="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md z-20">
                   <div className="flex items-center"><i className="fas fa-cloud text-xl text-blue-400 mr-2"></i><h1 className="font-bold tracking-wide">Admin Hub</h1></div>
                   <button onClick={onLogout} className="bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center"><i className="fas fa-power-off text-sm text-red-400"></i></button>
                </div>
                <div className="md:hidden bg-white border-b border-slate-200 p-2 shadow-sm z-10 flex gap-2 overflow-x-auto">
                   {menuItems.map(item => (
                     <button key={item.id} onClick={() => setActiveTab(item.id)} className={`whitespace-nowrap px-4 py-2 text-xs font-bold rounded-full ${activeTab === item.id ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-500'}`}>{item.label}</button>
                   ))}
                   <button onClick={() => setShowLocModal(true)} className="whitespace-nowrap px-4 py-2 text-xs font-bold rounded-full bg-slate-100 text-slate-500"><i className="fas fa-cog"></i></button>
                </div>

                <main className="flex-1 overflow-y-auto p-4 md:p-8">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 md:mb-8 gap-4">
                    <div>
                      <h2 className="text-2xl font-black text-slate-800 tracking-tight">{menuItems.find(i=>i.id===activeTab)?.label || 'Pengaturan'}</h2>
                      <p className="text-sm font-medium text-slate-500 mt-1 flex items-center"><i className="fas fa-circle text-[8px] text-green-500 mr-2 animate-pulse"></i> Live tersinkronisasi dari Cloud</p>
                    </div>
                    
                    {activeTab === 'monitoring' && (
                       <button onClick={exportData} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition-colors shadow-md flex items-center">
                         <i className="fas fa-file-excel mr-2 text-lg"></i> Export ke Excel
                       </button>
                    )}
                  </div>

                  {activeTab === 'monitoring' && (
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse whitespace-nowrap">
                          <thead>
                            <tr className="bg-slate-50/80 text-slate-500 border-b border-slate-200 text-xs uppercase tracking-wider font-bold">
                              <th className="p-4 pl-6">Pegawai</th>
                              <th className="p-4">Log Absen</th>
                              <th className="p-4">Tanggal & Waktu</th>
                              <th className="p-4">Validasi GPS</th>
                              <th className="p-4 pr-6 text-right">Foto Bukti</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {logs.length === 0 ? <tr><td colSpan="5" className="p-12 text-center text-slate-400 font-medium"><i className="fas fa-folder-open text-4xl mb-3 block opacity-20"></i>Database kosong.</td></tr> : 
                              logs.map(log => (
                                <tr key={log.dbId} className="hover:bg-slate-50/50 transition-colors">
                                  <td className="p-4 pl-6 font-bold text-slate-800">{log.userName}</td>
                                  <td className="p-4">
                                     <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider ${log.type.includes('Masuk') ? 'bg-emerald-100 text-emerald-700' : log.type.includes('Pulang') ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>
                                       {log.type}
                                     </span>
                                  </td>
                                  <td className="p-4 text-sm font-medium text-slate-600"><i className="far fa-calendar-alt text-slate-400 mr-1.5"></i> {log.date} <span className="mx-1 text-slate-300">|</span> <i className="far fa-clock text-slate-400 mr-1.5"></i> {log.time}</td>
                                  <td className="p-4">
                                    <span className={`flex items-center text-xs font-bold ${log.status === 'Tepat Lokasi' ? 'text-emerald-600' : 'text-rose-500'}`}>
                                      <i className={`fas ${log.status === 'Tepat Lokasi' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-1.5`}></i>{log.status}
                                    </span>
                                  </td>
                                  <td className="p-4 pr-6 flex justify-end">
                                    <div className="w-10 h-10 rounded-lg overflow-hidden border border-slate-200 shadow-sm bg-slate-100 hover:scale-150 transform transition-transform origin-right cursor-pointer">
                                      <img src={log.photo} alt="Validasi" className="w-full h-full object-cover" />
                                    </div>
                                  </td>
                                </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {activeTab === 'validasi' && (
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                      {requests.length === 0 ? <div className="col-span-full bg-white p-12 rounded-2xl border border-slate-200 text-center text-slate-400 font-medium"><i className="fas fa-inbox text-4xl mb-3 block opacity-20"></i>Tidak ada antrean persetujuan.</div> : 
                        requests.map(req => (
                          <div key={req.dbId} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                            <div>
                              <div className="flex justify-between items-start mb-3">
                                <div className="flex items-center">
                                  <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold mr-3">{req.userName.charAt(0)}</div>
                                  <div>
                                    <span className="font-bold text-slate-800 block leading-tight">{req.userName}</span>
                                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{req.date}</span>
                                  </div>
                                </div>
                                <span className={`px-2.5 py-1 text-[10px] font-black uppercase tracking-wider rounded-md ${req.status === 'Menunggu' ? 'bg-amber-100 text-amber-700' : req.status === 'Disetujui' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                  {req.status}
                                </span>
                              </div>
                              
                              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4">
                                <div className="flex items-center mb-1"><span className="text-xs font-bold text-blue-600 uppercase tracking-wider mr-2">{req.type}</span></div>
                                <p className="text-sm font-medium text-slate-700">"{req.reason}"</p>
                              </div>
                            </div>
                            
                            {req.status === 'Menunggu' && (
                              <div className="flex gap-2 border-t border-slate-100 pt-4">
                                <button onClick={() => updateRequestStatus(req.dbId, 'Ditolak')} className="flex-1 py-2 border-2 border-slate-200 text-slate-500 rounded-xl hover:bg-slate-50 hover:text-rose-600 hover:border-rose-200 text-xs font-bold transition-all">TOLAK</button>
                                <button onClick={() => updateRequestStatus(req.dbId, 'Disetujui')} className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition-all shadow-md">SETUJUI IZIN</button>
                              </div>
                            )}
                          </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'laporan' && (
                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                       {reports.length === 0 ? <div className="col-span-full bg-white p-12 rounded-2xl border border-slate-200 text-center text-slate-400 font-medium"><i className="fas fa-clipboard-list text-4xl mb-3 block opacity-20"></i>Belum ada laporan masuk hari ini.</div> : 
                         reports.map(rep => (
                           <div key={rep.dbId} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                             <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                               <span className="font-bold text-slate-800">{rep.userName}</span>
                               <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md"><i className="fas fa-clock mr-1"></i> {rep.date}</span>
                             </div>
                             <p className="text-sm font-medium text-slate-600 whitespace-pre-line leading-relaxed">{rep.content}</p>
                           </div>
                       ))}
                    </div>
                  )}

                </main>

                {/* Modal Pengaturan Lokasi */}
                {showLocModal && (
                   <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                      <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
                         <div className="bg-slate-800 p-5 text-white flex justify-between items-center">
                            <h3 className="font-bold tracking-wide"><i className="fas fa-map-marked-alt mr-2 text-blue-400"></i> Set Pusat Koordinat</h3>
                            <button onClick={()=>setShowLocModal(false)}><i className="fas fa-times"></i></button>
                         </div>
                         <div className="p-6">
                            <p className="text-xs font-medium text-slate-500 mb-4 line-clamp-2">Masukkan titik kordinat kantor Anda. Pegawai hanya dapat melakukan absen masuk di radius 100m dari titik ini.</p>
                            <div className="space-y-4 mb-6">
                              <div><label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Latitude</label><input type="number" step="any" value={newLat} onChange={(e) => setNewLat(parseFloat(e.target.value))} className="w-full border-2 border-slate-100 rounded-xl bg-slate-50 p-3 outline-none focus:border-blue-500 font-medium text-slate-700" /></div>
                              <div><label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Longitude</label><input type="number" step="any" value={newLng} onChange={(e) => setNewLng(parseFloat(e.target.value))} className="w-full border-2 border-slate-100 rounded-xl bg-slate-50 p-3 outline-none focus:border-blue-500 font-medium text-slate-700" /></div>
                            </div>
                            <button onClick={()=>{ setOfficeLoc({lat: newLat, lng: newLng}); setShowLocModal(false); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">SIMPAN KE CLOUD</button>
                         </div>
                      </div>
                   </div>
                )}

              </div>
            </div>
          );
        }

        // --- RENDER APLIKASI ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AbsensiApp />);
    </script>
</body>
</html>
